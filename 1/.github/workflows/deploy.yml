name: Deploy Project 1

on:
  push:
    branches:
      - main
    paths:
      - "1/**"
      - ".github/workflows/deploy-1.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 1/package-lock.json

      - name: Install dependencies
        working-directory: 1
        run: npm ci

      - name: Build
        working-directory: 1
        run: npm run build

      - name: Prepare deployment
        run: |
          mkdir -p deploy/1
          cp -r 1/dist/* deploy/1/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
