name: Deploy Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Build project 1
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 1/package-lock.json

      - name: Install dependencies
        working-directory: ./1
        run: npm install

      - name: Build React project
        working-directory: ./1
        run: npm run build

      # =========================
      # Prepare GitHub Pages
      # =========================
      - name: Prepare Pages
        run: |
          mkdir -p ./_site/1
          mkdir -p ./_site/old
          mkdir -p ./_site/vnrom.net

          cp ./index.html ./_site/index.html

          cp -r ./1/dist/* ./_site/1/

          cp -r ./old/* ./_site/old/

          cp -r ./vnrom.net/* ./_site/vnrom.net/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
