name: Deploy Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ========================================
  # BUILD
  # ========================================
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # --------------------------------------
      # Checkout repository
      # --------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------
      # Setup Node.js
      # --------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 1/package-lock.json

      # --------------------------------------
      # Install dependencies
      # --------------------------------------
      - name: Install dependencies
        working-directory: ./1
        run: npm ci

      # --------------------------------------
      # Build React project
      # --------------------------------------
      - name: Build React project
        working-directory: ./1
        run: npm run build

      # --------------------------------------
      # Prepare GitHub Pages
      # --------------------------------------
      - name: Prepare Pages
        shell: bash
        run: |
          set -e

          echo "Creating _site directory..."

          rm -rf ./_site

          mkdir -p ./_site/1
          mkdir -p ./_site/old
          mkdir -p ./_site/vnrom.net

          echo "Copying root index.html..."
          cp ./index.html ./_site/index.html

          echo "Copying React build..."
          cp -r ./1/dist/. ./_site/1/

          echo "Copying old..."
          cp -r ./old/. ./_site/old/

          echo "Copying vnrom.net..."
          cp -r ./vnrom.net/. ./_site/vnrom.net/

          echo "Final _site structure:"
          find ./_site -maxdepth 3 -type f | sort

      # --------------------------------------
      # Configure GitHub Pages
      # --------------------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # --------------------------------------
      # Upload Pages artifact
      # --------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site


  # ========================================
  # DEPLOY
  # ========================================
  deploy:
    runs-on: ubuntu-latest

    needs:
      - build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # --------------------------------------
      # Deploy to GitHub Pages
      # --------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
