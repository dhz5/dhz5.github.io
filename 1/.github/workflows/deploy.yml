name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Project 1 dependencies
        working-directory: ./1
        run: npm install

      - name: Build Project 1
        working-directory: ./1
        run: npm run build

      - name: Prepare GitHub Pages
        run: |
          mkdir -p deploy
          
          # Copy website cũ
          cp -r . deploy/
          
          # Xóa các file không cần thiết khỏi bản deploy
          rm -rf deploy/.git
          rm -rf deploy/.github
          rm -rf deploy/1/node_modules
          rm -rf deploy/1/dist

          # Thay nội dung /1 bằng bản đã build
          rm -rf deploy/1
          mkdir -p deploy/1
          cp -r 1/dist/. deploy/1/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
