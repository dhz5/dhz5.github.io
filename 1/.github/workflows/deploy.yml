name: Deploy Vite Site

on:
  push:
    branches:
      - main # Chạy khi bạn push code lên nhánh main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './1/package-lock.json' # Trỏ vào thư mục 1 của bạn

      - name: Install and Build
        run: |
          cd 1
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: 1/dist # Đẩy thư mục dist sau khi build lên
          branch: gh-pages # Đẩy vào nhánh phụ này để chạy web
